[package]
name = "tonic-backend"
version = "0.1.0"
description = "A Tauri App"
authors = ["andude10"]
edition = "2021"

[features]
rust_decimal_align16 = ["rust_decimal/align16"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tonic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chumsky = {version = "0.12.0", features = ["pratt", "regex"] }
sonic-rs = "0.3"
thiserror = "2.0.18"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
flate2 = "1.1.9"
tar = "0.4"
rust_decimal = { version = "1.40.0", features = ["serde-with-str", "align16"] }
rstar = "0.12"
petgraph = "0.8"
cold-string = { version = "0.2.0", features = ["serde"] }
parking_lot = { version = "0.12.5", features = ["serde"] }
tokio = { version = "1.51.0", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-stream = { version = "0.1", features = ["time", "sync"] }

# Optimize dependencies even in dev builds — huge speedup for
# serde, flate2, chumsky etc. while keeping tonic_lib itself debuggable.
[profile.dev.package."*"]
opt-level = 2

# Release profile: full optimizations + LTO
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
